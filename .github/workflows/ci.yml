name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify freshbooks-cli release contract
        run: |
          git clone --depth 1 https://github.com/kmorey/freshbooks-cli.git "$RUNNER_TEMP/freshbooks-cli"
          state_dir="$(mktemp -d)"
          diagnostics="$(
            XDG_CONFIG_HOME="$state_dir/config" \
            XDG_DATA_HOME="$state_dir/data" \
            XDG_STATE_HOME="$state_dir/state" \
            HOME="$state_dir/home" \
            node "$RUNNER_TEMP/freshbooks-cli/bin/freshbooks.js" diagnostics status --json
          )"
          DIAGNOSTICS="$diagnostics" node <<'NODE'
          const assert = require('node:assert/strict')
          const envelope = JSON.parse(process.env.DIAGNOSTICS)
          assert.equal(envelope.schemaVersion, 1)
          assert.equal(envelope.ok, true)
          assert.equal(envelope.data.version, '0.3.0')
          assert.equal(envelope.data.canonicalContractVersion, 2)
          assert.equal(envelope.data.capabilities.includes('canonical-tracking-v2'), true)
          assert.equal(envelope.data.capabilities.includes('mutation-receipts'), true)
          NODE
      - run: npm test
      - name: Validate Omarchy plugin manifest
        run: |
          curl -fsSL https://raw.githubusercontent.com/omacom/omarchy/b71dcad96e9d0b2962b7d225828a5cb6000ad720/bin/omarchy-plugin-validate -o /tmp/omarchy-plugin-validate
          bash /tmp/omarchy-plugin-validate .
